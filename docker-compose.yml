version: '3.8'

services:
  mongodb:
    image: mongo:7-jammy
    container_name: billing_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - billing_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: billing_backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/billing}
      - JWT_SECRET=${JWT_SECRET:-agro_secret_key}
    depends_on:
      - mongodb
    networks:
      - billing_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-http://localhost:5000/api}
    container_name: billing_frontend
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - billing_network

volumes:
  mongo_data:

networks:
  billing_network:
    driver: bridge
